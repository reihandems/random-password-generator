<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-linear-to-t from-sky-500 to-indigo-500">
    <div class="h-screen grid grid-cols-1 content-center justify-items-center">
        <form class="text-center w-120 bg-indigo-600 p-8 rounded-2xl shadow-md">
            <h1 class="text-3xl font-bold mb-4">Random Password Generator</h1>
    
            <div class="grid-cols-1 justify-items-center content-center">
                <fieldset class="fieldset flex-col items-center w-full">
                    <label class="label" for="passwordLength">Password Length</label>
                    <input type="number" id="passwordLength" class="input w-full" placeholder="Minimum length: 8" />
                </fieldset><br>
            </div>
            <!-- password length end -->
            
            <label class="label">
                <input type="checkbox" checked="checked" class="checkbox checkbox-primary" id="includeLowercase"/>
                Lowercase
            </label>
            <!-- include lowercase end -->
    
            <label class="label">
                <input type="checkbox" checked="checked" class="checkbox checkbox-secondary" id="includeUppercase" />
                Uppercase
            </label>
            <!-- include uppercase end -->
    
            <label class="label">
                <input type="checkbox" checked="checked" class="checkbox checkbox-warning" id="includeNumbers" />
                Numbers
            </label>
            <!-- include numbers end -->
    
            <label class="label">
                <input type="checkbox" checked="checked" class="checkbox checkbox-success" id="includeSymbols" />
                Symbols
            </label>
            <!-- include symbols end -->
             <br><br>
    
            <button type="button" class="btn btn-soft btn-primary" onclick="generatePassword()">🚀 Generate Password</button>

            <div class="aura aura-gold mt-5 w-full">
                <div class="card bg-base-100">
                    <div class="card-body" id="result">
                        <p class="text-lg text-gray-500">Your generated password will be shown here.</p>
                    </div>
                </div>
            </div>
        </form>

        <div class="chat chat-start mt-3">
            <div class="chat-image avatar">
                <div class="w-10 rounded-full">
                    <img alt="Tailwind CSS chat bubble component"
                        src="https://reihandems.netlify.app/img/foto2.jpg" />
                </div>
            </div>
            <div class="chat-bubble w-full">Made with 🤍 by Reihan D. Challada</div>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
